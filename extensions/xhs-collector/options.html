<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>采集插件连接设置</title><link rel="stylesheet" href="style.css"></head><body class="options">
<main><p class="eyebrow">XHS COLLECTOR · 连接设置</p><h1>连接你的本地知识库</h1><p>在工作台「知识库 → 采集插件」复制配对码，粘贴到下方。</p>
<form id="form"><label>工作台地址<input id="endpoint" type="url" required value="http://127.0.0.1:8788"></label><label>配对码<input id="key" type="password" required autocomplete="off" spellcheck="false" placeholder="工作台提供的本机配对码"></label><button type="button" id="open-workspace" class="link-button">不知道配对码？打开工作台配对页 ↗</button><button class="primary">保存并测试连接</button></form><p id="status" role="status"></p><p>配对码仅用于向本机知识库保存内容，无需填写小红书账号信息。</p></main><script type="module" src="options.js"></script></body></html>
