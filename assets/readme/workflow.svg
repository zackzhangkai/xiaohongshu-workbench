<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" aria-labelledby="wf-title wf-desc" role="img" viewBox="0 0 1200 330"><title id="wf-title">工作流：采集 → 知识库 → AI 创作 → 稿件导出</title><desc id="wf-desc">四段流程图：Chrome 采集插件把小红书笔记批量入库，知识库保存笔记与评论并可本地镜像，AI 对话在 20 个技能与生图工具支持下创作，最后经稿件库导出 ZIP、Finder 或一键复制去发布；底部横条标注全部数据留在本机、服务仅监听 127.0.0.1。</desc><rect width="1200" height="330" fill="#FAF6EF" rx="24"/><g id="stage-collect" transform="translate(64 56)"><rect width="238" height="170" fill="#FFF" stroke="#E8DFD0" rx="16"/><circle cx="50" cy="50" r="22" fill="none" stroke="#E9405A" stroke-width="5"/><circle cx="50" cy="50" r="9" fill="#E9405A"/><path fill="none" stroke="#8A7E6E" stroke-width="3" d="M 88 38 h 54 v 24 h -40 l -10 9 v -9 h -4 z"/><text x="32" y="112" fill="#2B2620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="600">Chrome 采集</text><text x="32" y="142" fill="#8A7E6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">单篇 / 高赞批量入库</text></g><g id="stage-knowledge" transform="translate(362 56)"><rect width="238" height="170" fill="#FFF" stroke="#E8DFD0" rx="16"/><rect width="52" height="34" x="44" y="34" fill="none" stroke="#8A7E6E" stroke-width="3" rx="6"/><rect width="52" height="34" x="52" y="26" fill="#FAF6EF" stroke="#E9405A" stroke-width="3" rx="6"/><rect width="52" height="34" x="60" y="18" fill="#FFF" stroke="#E8DFD0" stroke-width="3" rx="6"/><text x="32" y="112" fill="#2B2620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="600">知识库</text><text x="32" y="142" fill="#8A7E6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">笔记 · 评论 · 镜像</text></g><g id="stage-create" transform="translate(660 56)"><rect width="238" height="170" fill="#FFF" stroke="#E8DFD0" rx="16"/><path fill="none" stroke="#8A7E6E" stroke-width="3" d="M 40 30 h 92 a 12 12 0 0 1 12 12 v 30 a 12 12 0 0 1 -12 12 h -58 l -14 13 v -13 h -20 a 12 12 0 0 1 -12 -12 v -30 a 12 12 0 0 1 12 -12 z"/><path fill="#E9405A" d="M 118 44 l 3.5 8 l 8.5 3.5 l -8.5 3.5 l -3.5 8 l -3.5 -8 l -8.5 -3.5 l 8.5 -3.5 z"/><text x="32" y="112" fill="#2B2620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="600">AI 对话创作</text><text x="32" y="142" fill="#8A7E6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">技能 · 生图 · SSE 流式</text></g><g id="stage-export" transform="translate(958 56)"><rect width="178" height="170" fill="#FFF" stroke="#E8DFD0" rx="16"/><rect width="60" height="44" x="44" y="34" fill="none" stroke="#8A7E6E" stroke-width="3" rx="6"/><path fill="none" stroke="#8A7E6E" stroke-width="3" d="M 44 48 h 60 M 60 34 v 14 h 28 v -14"/><rect width="22" height="18" x="78" y="58" fill="#E9405A" rx="4"/><text x="32" y="112" fill="#2B2620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="600">稿件导出</text><text x="32" y="142" fill="#8A7E6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">ZIP · 一键复制</text></g><g id="flow-arrows" fill="none" stroke="#C9BBA6" stroke-width="3"><path marker-end="url(#arrow)" d="M 306 141 h 46"/><path marker-end="url(#arrow)" d="M 604 141 h 42"/><path marker-end="url(#arrow)" d="M 902 141 h 42"/></g><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#C9BBA6" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g id="privacy-bar"><rect width="1072" height="46" x="64" y="252" fill="#F1E9DB" rx="23"/><path fill="none" stroke="#2B2620" stroke-width="3" d="M 100 262 l 14 5 v 9 c 0 7 6 12 14 14 c 8 -2 14 -7 14 -14 v -9 l 14 -5 l -14 -5 v -4 h -28 v 4 z" transform="translate(173 4)"/><text x="345" y="282" fill="#2B2620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">全部数据留在本机 · 服务仅监听 127.0.0.1 · 不注册账号、不上传云端</text></g></svg>