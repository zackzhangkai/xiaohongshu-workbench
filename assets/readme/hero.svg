<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">小红书工作台 — 本地优先的自媒体 AI 工作台</title>
  <desc id="hero-desc">暖米色横幅：左侧为项目名与「对话创作、知识库、采集、稿件管理，数据只留本机」的价值句及技能、测试、监听地址、许可四枚元信息芯片；右上方为一张小红书图文卡片示意，右下方是一条指向卡片的对话气泡。</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9405A"/>
      <stop offset="1" stop-color="#F2A0AE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#FAF6EF"/>

  <!-- 左：标题区 -->
  <g id="title-block">
    <rect x="64" y="62" width="44" height="6" rx="3" fill="#E9405A"/>
    <text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" letter-spacing="3" fill="#8A7E6E">本地优先 · 自媒体 AI 工作台</text>
    <text x="60" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="64" font-weight="700" fill="#2B2620">小红书工作台</text>
    <text x="64" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#5A5040">对话创作 · 知识库 · 采集 · 稿件管理，全部数据只留在本机</text>
  </g>

  <!-- 元信息芯片 -->
  <g id="meta-chips" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#5A5040">
    <g id="chip-skills">
      <rect x="64" y="252" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E8DFD0"/>
      <text x="139" y="278" text-anchor="middle">20 个内置技能</text>
    </g>
    <g id="chip-tests">
      <rect x="226" y="252" width="124" height="40" rx="20" fill="#FFFFFF" stroke="#E8DFD0"/>
      <text x="288" y="278" text-anchor="middle">142 项测试</text>
    </g>
    <g id="chip-loopback">
      <rect x="362" y="252" width="200" height="40" rx="20" fill="#FFFFFF" stroke="#E8DFD0"/>
      <circle cx="386" cy="272" r="5" fill="#E9405A"/>
      <text x="400" y="278">仅监听 127.0.0.1</text>
    </g>
    <g id="chip-license">
      <rect x="574" y="252" width="84" height="40" rx="20" fill="#FFFFFF" stroke="#E8DFD0"/>
      <text x="616" y="278" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- 右上：小红书图文卡片示意 -->
  <g id="note-card">
    <rect x="782" y="44" width="330" height="224" rx="16" fill="#FFFFFF" stroke="#E8DFD0"/>
    <rect x="802" y="64" width="290" height="118" rx="10" fill="url(#cover)"/>
    <text x="818" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">AI 生成的封面</text>
    <text x="818" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#FFE3E8">3:4 · image_generate</text>
    <rect x="802" y="196" width="200" height="12" rx="6" fill="#EFE8DC"/>
    <rect x="802" y="218" width="150" height="12" rx="6" fill="#EFE8DC"/>
    <path transform="translate(990 234) scale(0.95)" d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z" fill="#E9405A"/>
    <text x="1022" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8A7E6E">收藏</text>
  </g>

  <!-- 右下：对话气泡，尾部指向上方卡片 -->
  <g id="chat-bubble">
    <rect x="834" y="288" width="226" height="52" rx="16" fill="#2B2620"/>
    <path d="M 934 300 L 947 270 L 960 300 Z" fill="#2B2620"/>
    <text x="947" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#FAF6EF">帮我把笔记写成图文</text>
  </g>
</svg>
